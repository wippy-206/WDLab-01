<!DOCTYPE html>
<html lang ="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport", content="width=device-width, initial-scale=1.0">
    <title>Bài 5 - Text + Demonstration></title>
</head>
<body>
    <header>
        <h1 align="center">IMAGES</h1>
    </header>

    <main>
        <section>
            <article>
                <figure>
                    <img src="images/mtheory.png" width=300 align="left">
                    <figcaption>
                        <p>
                            A paragraph with an image. The align attribute of the image is set to "left".
                            The image will float to the left of this text.
                        </p>
                    </figcaption>
                </figure>
            </article>
        </section>

        <br>

        <section>
            <article>
                <figure>
                    <img src="images/mtheory.png" width="300" align="right">
                    <figcaption>
                        <p>
                            A paragraph with an image. The align attribute of the image is set to "right".
                            The image will float to the right of this text.
                        </p>
                    </figcaption>
                </figure>
            </article>
        </section>
        
        <br>

    </main>
</body>
</html>
